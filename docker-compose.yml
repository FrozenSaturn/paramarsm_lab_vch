services:
  evolution:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVO_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evo:evo@postgres:5432/evo
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://host.docker.internal:${PORT:-3000}/webhook?token=${WEBHOOK_SECRET}
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [evo_instances:/evolution/instances]
    depends_on: [postgres, redis]
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: evo, POSTGRES_PASSWORD: evo, POSTGRES_DB: evo }
    volumes: [pg:/var/lib/postgresql/data]
  redis:
    image: redis:7
volumes: { evo_instances: {}, pg: {} }
